apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gmp-scrape
  namespace: wallettracker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-api
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gmp-system
    ports:
    - port: 8080
      protocol: TCP
