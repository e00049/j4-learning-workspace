apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-loadgen-to-agent
  namespace: wallettracker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-api
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: loadgen
    ports:
    - port: 8080
      protocol: TCP
