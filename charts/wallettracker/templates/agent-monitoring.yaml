{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: {{ .Values.agent.name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.agent.name }}
  endpoints:
  - port: {{ .Values.agent.port }}
    path: /metrics
    interval: {{ .Values.monitoring.interval }}
---
# Shipped WITH the PodMonitoring: monitoring can't exist without its network path.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gmp-scrape
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.agent.name }}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gmp-system
    ports:
    - port: {{ .Values.agent.port }}
      protocol: TCP
{{- end }}
