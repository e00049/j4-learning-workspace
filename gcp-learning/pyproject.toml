[project]
name = "gcp-ai-lab"
version = "0.1.0"
description = "GCP (Vertex AI / Gemini) adapter for the shared j4 categorizer"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.0",
    "j4-common",
]

[tool.uv.sources]
j4-common = { path = "../shared/j4-common", editable = true }

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
